version: '{build}'

image:
  - Visual Studio 2022
  - Ubuntu2404
  - macOS

configuration:
  - Release

for:
  # ============================================================
  # Windows
  # ============================================================
  - matrix:
      only:
        - image: Visual Studio 2022

    before_build:
      # AppVeyor provides vcpkg in C:\Tools\vcpkg.
      #
      # Fetch the current repository and then check out exactly the
      # builtin-baseline declared in this project's vcpkg.json.
      #
      # This is important because "git fetch" alone only updates the
      # remote refs; it does not update the vcpkg working tree.
      - ps: |
          git -C C:\Tools\vcpkg fetch origin master

          $baseline = (Get-Content -Raw vcpkg.json | ConvertFrom-Json).'builtin-baseline'

          Write-Host "Using vcpkg baseline: $baseline"

          git -C C:\Tools\vcpkg checkout --force $baseline

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to checkout vcpkg baseline $baseline"
          }

          & C:\Tools\vcpkg\bootstrap-vcpkg.bat -disableMetrics

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to bootstrap vcpkg"
          }

      # ----------------------------------------------------------
      # Windows x64
      #
      # Full PDFxTMD build including DPD support.
      #
      # ENABLE_DPD automatically enables the "dpd" vcpkg manifest
      # feature, which installs:
      #
      #   - zstd
      #   - oneDNN
      #
      # ----------------------------------------------------------
      - cmd: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_TOOLCHAIN_FILE=C:/Tools/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DENABLE_DPD=ON
          -DENABLE_BUILDING_WRAPPERS=OFF
          -DENABLE_BUILDING_EXAMPLES=ON
          -DENABLE_DOCUMENTATION=OFF

      # ----------------------------------------------------------
      # Windows ARM64
      #
      # The current vcpkg "dpd" feature is explicitly x64-only.
      # Therefore ARM64 is used to verify the portable core library
      # and the non-DPD examples.
      # ----------------------------------------------------------
      - cmd: >-
          cmake -S . -B build-arm64
          -G "Visual Studio 17 2022"
          -A ARM64
          -DENABLE_DPD=OFF
          -DENABLE_BUILDING_WRAPPERS=OFF
          -DENABLE_BUILDING_EXAMPLES=ON
          -DENABLE_DOCUMENTATION=OFF

    build_script:
      - cmd: cmake --build build --config %CONFIGURATION% --parallel 2
      - cmd: cmake --build build-arm64 --config %CONFIGURATION% --parallel 2


  # ============================================================
  # Linux
  # ============================================================
  - matrix:
      only:
        - image: Ubuntu2404

    install:
      - sh: sudo apt-get update
      - sh: sudo apt-get install -y software-properties-common
      - sh: sudo add-apt-repository -y universe
      - sh: sudo apt-get update
      - sh: sudo apt-get install -y libzstd-dev libdnnl-dev

    before_build:
      # Full Linux build with DPD support.
      - sh: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=$CONFIGURATION
          -DENABLE_DPD=ON
          -DENABLE_BUILDING_WRAPPERS=OFF
          -DENABLE_BUILDING_EXAMPLES=ON
          -DENABLE_DOCUMENTATION=OFF

    build_script:
      - sh: cmake --build build --parallel 2


  # ============================================================
  # macOS
  # ============================================================
  - matrix:
      only:
        - image: macOS

    install:
      - sh: brew install zstd onednn

    before_build:
      # Explicitly provide the Homebrew package prefixes so CMake
      # can reliably locate zstd and oneDNN.
      - sh: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=$CONFIGURATION
          -DCMAKE_PREFIX_PATH="$(brew --prefix zstd);$(brew --prefix onednn)"
          -DENABLE_DPD=ON
          -DENABLE_BUILDING_WRAPPERS=OFF
          -DENABLE_BUILDING_EXAMPLES=ON
          -DENABLE_DOCUMENTATION=OFF

    build_script:
      - sh: cmake --build build --parallel 2
