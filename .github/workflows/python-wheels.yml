name: Python wheels

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'wrappers/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - 'setup.py'
      - 'vcpkg.json'
      - '.github/workflows/**'
  push:
    tags:
      - "v*"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-15-intel
          - windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bootstrap vcpkg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: |
          set -euxo pipefail
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"

          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone vcpkg."
          }

          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to bootstrap vcpkg."
          }

          "VCPKG_ROOT=$vcpkgRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "pp* *-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BUILD_VERBOSITY: "1"

          CIBW_TEST_COMMAND: >-
            python -c "import pdfxtmd;
            print('PDFxTMD Python module:', pdfxtmd.__file__);
            assert pdfxtmd.__has_dpd__,
            'wheel was built without DPD support'"

          # Linux wheels are built inside the manylinux container, so vcpkg
          # must be bootstrapped inside that container.
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y git curl zip unzip tar &&
            git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg &&
            /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics

          CIBW_ENVIRONMENT_LINUX: >-
            PDFXTMD_ENABLE_DPD=ON
            VCPKG_ROOT=/opt/vcpkg
            VCPKG_TARGET_TRIPLET=x64-linux

          # std::filesystem in the Xcode/libc++ used by the Intel runner
          # requires a deployment target of at least macOS 10.15.
          CIBW_ENVIRONMENT_MACOS: >-
            PDFXTMD_ENABLE_DPD=ON
            MACOSX_DEPLOYMENT_TARGET=10.15
            VCPKG_TARGET_TRIPLET=x64-osx

          # Keep native vcpkg libraries static inside the Windows wheel while
          # retaining the dynamic MSVC runtime expected by Python extensions.
          CIBW_ENVIRONMENT_WINDOWS: >-
            PDFXTMD_ENABLE_DPD=ON
            VCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: List generated wheels
        shell: bash
        run: ls -lh wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: List wheels
        run: ls -lh dist

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
