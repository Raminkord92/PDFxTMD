name: C++ CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'wrappers/**'
      - 'cmake/**'
      - 'examples/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'wrappers/**'
      - 'cmake/**'
      - 'examples/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 (DPD)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd-dev libdnnl-dev

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_DPD=ON
          -DENABLE_BUILDING_WRAPPERS=OFF
          -DENABLE_BUILDING_EXAMPLES=ON
          -DENABLE_DOCUMENTATION=OFF

      - name: Build
        run: cmake --build build --parallel 2

  macos:
    name: macOS Intel (DPD)
    runs-on: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install zstd onednn

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$(brew --prefix zstd);$(brew --prefix onednn)" \
            -DENABLE_DPD=ON \
            -DENABLE_BUILDING_WRAPPERS=OFF \
            -DENABLE_BUILDING_EXAMPLES=ON \
            -DENABLE_DOCUMENTATION=OFF

      - name: Build
        run: cmake --build build --parallel 2

  windows-x64:
    name: Windows x64 (DPD)
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "vcpkg-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $baseline = (Get-Content -Raw vcpkg.json | ConvertFrom-Json).'builtin-baseline'

          Write-Host "Using vcpkg baseline: $baseline"

          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone vcpkg"
          }

          git -C $vcpkgRoot checkout --force $baseline
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to checkout vcpkg baseline $baseline"
          }

          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to bootstrap vcpkg"
          }

          "VCPKG_ROOT=$vcpkgRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DENABLE_DPD=ON `
            -DENABLE_BUILDING_WRAPPERS=OFF `
            -DENABLE_BUILDING_EXAMPLES=ON `
            -DENABLE_DOCUMENTATION=OFF

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build
        run: cmake --build build --config Release --parallel 2

  windows-arm64:
    name: Windows ARM64 (core)
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A ARM64 `
            -DENABLE_DPD=OFF `
            -DENABLE_BUILDING_WRAPPERS=OFF `
            -DENABLE_BUILDING_EXAMPLES=ON `
            -DENABLE_DOCUMENTATION=OFF

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build
        run: cmake --build build --config Release --parallel 2
